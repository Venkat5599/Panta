name: Deploy factory

on:
  push:
    branches: [main]
    paths:
      - "apps/factory/**"
      - "packages/**"
      - "ops/**"
      - "bun.lock"
  workflow_dispatch:

concurrency:
  group: deploy-factory
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Inert until the box exists. Set the repository variable DEPLOY_ENABLED to
    # 'true' once VPS_HOST, VPS_USER and VPS_SSH_KEY are configured, so this
    # does not fail red on every push in the meantime.
    if: vars.DEPLOY_ENABLED == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      # Never deploy something that does not pass its own gates, even though CI
      # also runs. A deploy triggered by workflow_dispatch skips CI entirely.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin the host key rather than trusting on first use: a MITM here
          # would receive the deploy, and this box holds a funded hot wallet.
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          ssh "$USER@$HOST" "mkdir -p /opt/premium/releases/$SHA"
          rsync -az --delete \
            --exclude '.git' --exclude 'node_modules' --exclude 'fixtures' \
            ./ "$USER@$HOST:/opt/premium/releases/$SHA/"

      - name: Activate and health-check
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          # deploy.sh swaps the symlink only after health passes, and rolls
          # back to the previous release by itself if it does not.
          ssh "$USER@$HOST" "bash /opt/premium/releases/${GITHUB_SHA}/ops/deploy.sh ${GITHUB_SHA}"

      - name: Confirm the service is live
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: ssh "$USER@$HOST" "systemctl is-active premium-factory"
